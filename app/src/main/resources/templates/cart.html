<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>ショッピングカート</title>
  <link rel="stylesheet" th:href="@{/css/cart.css}">
</head>
<body>

<h1 class="site-title">
    <span>🛒 ショッピングカート</span>

    <!-- ボタンをまとめるラッパー -->
    <div class="button-group">
        <a th:href="@{/myPage}" title="マイページに移動" class="mypage-button">マイページに移動🛒</a>
        <a th:href="@{/index}" title="ショップに移動" class="cart-button">ショップに移動🛒</a>
    </div>
</h1>

<div class="cart-container">
    <!-- カートが空の場合 -->
    <div th:if="${#lists.isEmpty(cartViewResultListDTO.cartViewList)}" class="empty-cart">
        カートに商品は入っていません。
    </div>

    <!-- カート商品リスト -->
    <div th:each="item : ${cartViewResultListDTO.cartViewList}" class="cart-item-card">
        <div class="cart-item-image">
            <img th:if="${item.imageUrl != null}" th:src="${item.imageUrl}" alt="商品画像">
            <span th:if="${item.imageUrl == null}">画像なし</span>
        </div>
        <div class="cart-item-info">
            <h2 th:text="${item.productName}">商品名</h2>
            <div><strong>価格:</strong> <span th:text="${#numbers.formatInteger(item.price, 3, 'COMMA')}"></span> 円</div>
            <div><strong>個数:</strong> <span th:text="${item.quantity}"></span></div>
            <div><strong>メーカー:</strong> <span th:text="${item.maker}"></span></div>
            <div><strong>カテゴリ:</strong> <span th:text="${item.category}"></span></div>
            <form th:action="@{/cart/delete}" method="post">
                <input type="hidden" name="cartId" th:value="${item.cartId}">
                <button type="submit">カートから削除</button>
            </form>
        </div>
    </div>

    <!-- カート下部（合計金額・注文確定ボタン） -->
    <div th:if="${!#lists.isEmpty(cartViewResultListDTO.cartViewList)}" class="cart-footer">
        <div class="total-price">
            合計金額: <span th:text="${#numbers.formatInteger(totalPrice, 3, 'COMMA')}"></span> 円
        </div>
        <div class="order-button-wrapper">
            <form th:action="@{/buy/add}" method="post">
                <button type="submit" class="order-button">注文を確定する</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
