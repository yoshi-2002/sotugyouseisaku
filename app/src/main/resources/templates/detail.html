<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>商品詳細</title>
  <link rel="stylesheet" th:href="@{/css/detail.css}">
</head>
<body>

<header class="under-header">
    <div class="header-left">商品詳細</div>
</header>

<div class="result-box">
    <div class="product-detail">
        <!-- 左に画像 -->
        <div class="product-image">
            <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" alt="商品画像">
            <span th:if="${product.imageUrl == null}">画像なし</span>
        </div>

        <!-- 右に情報 -->
        <div class="product-info">
            <h2 class="product-name" th:text="${product.name}">商品名</h2>
            <div><strong>商品ID:</strong> <span th:text="${product.id}"></span></div>
            <div><strong>状態:</strong> <span th:text="${product.jyoutai}"></span></div>
            <div><strong>商品説明:</strong> <span th:text="${product.description}"></span></div>
            <div><strong>価格:</strong> <span th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')}"></span> 円</div>
            <div><strong>在庫数:</strong> <span th:text="${product.stock}"></span></div>
            <div><strong>メーカー:</strong> <span th:text="${product.maker}"></span></div>
            <div><strong>カテゴリ:</strong> <span th:text="${product.category}"></span></div>

            <!-- カート追加ボタン -->
            <form th:action="@{/cart/add}" method="post">
                <input type="hidden" name="productId" th:value="${product.id}">
                <button type="submit">カートへ追加</button>
            </form>

            <!-- 一覧へ戻る -->
            <p><a th:href="@{/index}">← 商品一覧に戻る</a></p>
        </div>
    </div>
</div>

</body>
</html>
