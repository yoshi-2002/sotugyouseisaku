<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>商品詳細</title>
  <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>

<header class="under-header">
    <div class="header-left">商品詳細</div>
</header>

<div class="result-box">
    <table border="1">
        <tr>
            <th>商品ID</th>
            <td th:text="${product.id}"></td>
        </tr>
        <tr>
            <th>商品名</th>
            <td th:text="${product.name}"></td>
        </tr>
        <tr>
            <th>状態</th>
            <td th:text="${product.jyoutai}"></td>
        </tr>
        <tr>
            <th>商品説明</th>
            <td th:text="${product.description}"></td>
        </tr>
        <tr>
            <th>価格</th>
            <td th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')}"></td>
        </tr>
        <tr>
            <th>在庫数</th>
            <td th:text="${product.stock}"></td>
        </tr>
        <tr>
            <th>メーカー</th>
            <td th:text="${product.maker}"></td>
        </tr>
        <tr>
            <th>カテゴリ</th>
            <td th:text="${product.category}"></td>
        </tr>
        <tr>
            <th>画像</th>
            <td>
                <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" alt="商品画像" width="400">
                <span th:if="${product.imageUrl == null}">画像なし</span>
            </td>
        </tr>
    </table>

    <!-- カート追加ボタン -->
    <form th:action="@{/cart/add}" method="post">
        <input type="hidden" name="productId" th:value="${product.id}">
        <button type="submit">カートへ追加</button>
    </form>

    <!-- 一覧へ戻る -->
    <p><a th:href="@{/index}">← 商品一覧に戻る</a></p>
</div>

</body>
</html>
