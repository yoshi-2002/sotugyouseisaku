<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>マイページ</title>
  <link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>
<body>

<h1 class="site-title">
    <span>👤 マイページ</span>

    <!-- ボタンをまとめるラッパー -->
    <div class="button-group">
        <a th:href="@{/cart}" title="カートに移動" class="mypage-button">カートに移動🛒</a>
        <a th:href="@{/index}" title="ショップに移動" class="cart-button">ショップに移動🛒</a>
    </div>
</h1>

<div th:if="${cartMessage}" class="cart-message">
  <p th:text="${cartMessage}"></p>
</div>

<!-- カート情報 -->
<header class="under-header">
    <div class="header-left">カート情報</div>
</header>
<div class="result-box mypage-container">

    <!-- カートが空の場合 -->
    <div th:if="${#lists.isEmpty(cartViewResultListDTO.cartViewList)}" class="empty-section">
        カートに商品は入っていません。
    </div>

    <!-- カート商品カード -->
    <div class="card-grid">
        <div th:each="item : ${cartViewResultListDTO.cartViewList}" class="mypage-item-card">
            <div class="mypage-item-image">
                <img th:if="${item.imageUrl != null}" th:src="${item.imageUrl}" alt="商品画像">
                <div th:if="${item.imageUrl == null}" class="no-image">画像なし</div>
            </div>
            <div class="mypage-item-info">
                <h3 th:text="${item.productName}">商品名</h3>
                <p><strong>カートID:</strong> <span th:text="${item.cartId}"></span></p>
                <p><strong>状態:</strong> <span th:text="${item.jyoutai}"></span></p>
                <p><strong>価格:</strong> <span th:text="${#numbers.formatInteger(item.price, 3, 'COMMA')}"></span> 円</p>
                <p><strong>個数:</strong> <span th:text="${item.quantity}"></span></p>
                <p><strong>メーカー:</strong> <span th:text="${item.maker}"></span></p>
                <p><strong>カテゴリ:</strong> <span th:text="${item.category}"></span></p>
                <form th:action="@{/myPage/cart/delete}" method="post">
                    <input type="hidden" name="cartId" th:value="${item.cartId}">
                    <button type="submit">カートから削除</button>
                </form>
            </div>
        </div>
    </div>

    <!-- カート画面へのリンク -->
    <div style="margin-top: 10px; text-align: right;">
        <a th:href="@{/cart}" class="cart-button">購入する場合はカート画面へ</a>
    </div>
</div>

<!-- 注文内容 -->
<header class="under-header">
    <div class="header-left">注文内容</div>
</header>
<div class="result-box mypage-container">

    <!-- 注文履歴が空の場合 -->
    <div th:if="${#lists.isEmpty(buyViewResultListDTO.buyViewList)}" class="empty-section">
        注文中の商品はありません。
    </div>

    <!-- 注文履歴カード -->
    <div class="card-grid">
        <div th:each="item : ${buyViewResultListDTO.buyViewList}" class="mypage-item-card">
            <div class="mypage-item-image">
                <img th:if="${item.imageUrl != null}" th:src="${item.imageUrl}" alt="商品画像">
                <div th:if="${item.imageUrl == null}" class="no-image">画像なし</div>
            </div>
            <div class="mypage-item-info">
                <h3 th:text="${item.productName}">商品名</h3>
                <p><strong>購入ID:</strong> <span th:text="${item.buyId}"></span></p>
                <p><strong>状態:</strong> <span th:text="${item.jyoutai}"></span></p>
                <p><strong>価格:</strong> <span th:text="${#numbers.formatInteger(item.price, 3, 'COMMA')}"></span> 円</p>
                <p><strong>個数:</strong> <span th:text="${item.quantity}"></span></p>
                <p><strong>メーカー:</strong> <span th:text="${item.maker}"></span></p>
                <p><strong>カテゴリ:</strong> <span th:text="${item.category}"></span></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
